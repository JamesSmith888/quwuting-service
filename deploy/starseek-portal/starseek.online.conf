# starseek.online - 公安备案门户站点
# 当前 HTTP 直出静态门户；DNS 生效并申请 Let's Encrypt 证书后启用 443 + 301
server {
    listen       80;
    listen       [::]:80;
    server_name  starseek.online www.starseek.online;

    root  /var/www/starseek.online;
    index index.html;

    # Let's Encrypt HTTP-01 challenge 预留（DNS 生效后申请证书用）
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
