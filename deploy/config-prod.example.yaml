# ─────────────────────────────────────────────────────────────────────────────
# quwuting-service 环境文件模板（2026-08-30 PG→MySQL 迁移后配置策略）
#
# 用法：复制本文件到服务器 /etc/quwuting-service/environment 并填入真实值，
#       systemd 通过 EnvironmentFile 注入（见 deploy/deploy.sh 与 unit 模板）。
# ⚠ 该文件含生产凭据，禁止提交 git / 复制到仓库任何目录 / 外传。
#
# DB（阿里云 RDS MySQL，生产优先内网地址；外网地址仅本机运维直连）
DB_URL=jdbc:mysql://<RDS内网地址>:3306/qwt_mysql?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=8000&rewriteBatchedStatements=true
DB_USERNAME=qwt_app
DB_PASSWORD=<强密码>

# 微信小程序（application.yaml 占位 ${WECHAT_SECRET}）
WECHAT_SECRET=<微信小程序 secret>

# JWT 签名（application.yaml 占位 ${JWT_SECRET}）
JWT_SECRET=<JWT 签名密钥，建议 openssl rand -base64 32>

# Supabase Storage（前端直传，后端签发凭证；与 DB 解耦，迁移后继续使用）
SUPABASE_PROJECT_URL=https://<project-ref>.supabase.co
SUPABASE_ANON_KEY=<anon key>
SUPABASE_STORAGE_BUCKET=qwt-public

# 可选（腾讯位置服务 / 高德，无则留空）
# QQMAP_KEY=
# AMAP_KEY=
