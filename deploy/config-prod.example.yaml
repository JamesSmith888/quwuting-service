# ─────────────────────────────────────────────────────────────────────────────
# quwuting-service 生产外部配置模板（2026-08-31 配置策略调整）
#
# 用法：复制本文件到服务器 ${APP_DIR}/config/application-prod.yaml（APP_DIR 默认
#       /root/quwuting-service，即 jar 同目录的 config/ 子目录），填入真实值。
#       Spring Boot 外部化配置目录 ./config/ 的 application-{profile}.yaml
#       优先级高于 jar 内 classpath 同名文件 → 覆盖 git 内 application-prod.yaml
#       的 ${DB_URL:} 等空占位；systemd 不再注入任何敏感环境变量（deploy.sh）。
# ⚠ 该文件含生产凭据，禁止提交 git / 复制到仓库任何目录 / 外传。
#
# 本地开发敏感值则维护在 classpath 的 application-dev.yaml / application-mysql.yaml
# （同样 gitignored）——本地与生产各持一份 gitignored yml，互不干扰。
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    # 阿里云 RDS MySQL（生产优先内网地址；外网地址仅本机运维直连）。
    # 必须附加 serverTimezone=Asia/Shanghai & characterEncoding=utf8 &
    # useSSL=false&connectTimeout=5000&socketTimeout=8000。
    url: jdbc:mysql://<RDS内网地址>:3306/qwt_mysql?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=8000&rewriteBatchedStatements=true
    username: qwt_app
    password: <强密码>

# 微信小程序（覆盖 application.yaml 占位 ${WECHAT_SECRET}）
wechat:
  secret: <微信小程序 secret>

# JWT 签名（覆盖 application.yaml 占位 ${JWT_SECRET}；建议 openssl rand -base64 32）
jwt:
  secret: <JWT 签名密钥>

# Supabase Storage（前端直传，后端签发凭证；2026-09-17 起为过渡通道）
supabase:
  storage:
    project-url: https://<project-ref>.supabase.co
    anon-key: <anon key>
    bucket: qwt-public
    # 历史遗留 Supabase 项目 URL（旧项目图片未迁移，校验白名单；逗号分隔）
    # legacy-project-urls: https://<legacy-ref>.supabase.co

# 对象存储 Provider（2026-09-17 OSS 切回国内）
# 切流时序：先保持 provider=supabase 部署本版 → 小程序/后台新版本全量 →
# 下面四件套填好后把 provider 翻成 oss（改完重启服务生效，无需改代码）。
# OSS 配置（bucket 须与 ECS 同地域=华东1杭州，公共读）：
# 凭证走 ECS 实例角色（阿里云最佳实践，控制台不建议建长期 AK）：
#   1. RAM 控制台 → 角色 → 创建角色（阿里云服务 → ECS，角色名如 quwuting-oss-role）；
#   2. 给角色附加最小权限自定义策略（见 docs/agents/11-storage.md，仅本 bucket 读写）；
#   3. ECS 控制台 → 实例 → 实例设置 → 授予 RAM 角色 → 选该角色；
#   4. 下方 credential-mode 填 instance-role + instance-role-name 填角色名即可，
#      STS 临时凭证由后端自动拉取/轮转——无需任何 AccessKey。
storage:
  provider: supabase            # supabase | oss
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket: <bucket 名称，如 quwuting-public>
    credential-mode: instance-role
    instance-role-name: <ECS 实例角色名，如 quwuting-oss-role>
    access-key-id:              # 实例角色模式留空（本地开发才填 RAM AK）
    access-key-secret:          # 实例角色模式留空
    # 杭州 ECS 内网 endpoint：后端内容校验下载走内网（免流量费+毫秒级）
    internal-endpoint: oss-cn-hangzhou-internal.aliyuncs.com

# 可选（腾讯位置服务 / 高德，无则删除整个键）
# app:
#   geocode:
#     key: <腾讯位置服务 key>
#   amap:
#     key: <高德 key>

# 管理后台密码（2026-09-01 起生产弃环境变量：此值替代 ${WEB_ADMIN_PASSWORD}，
# **生产必须填写**，留空 = 密码登录通道禁用；本地开发凭据在 application-mysql.yaml）
web-auth:
  username: admin
  password: <管理后台密码>
