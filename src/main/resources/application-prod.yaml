# 生产环境配置（阿里云 RDS MySQL + Cloudflare Tunnel）
# 所有敏感值通过外部化配置注入，禁止硬编码、禁止依赖环境变量
# 启动命令：java -jar quwuting-service.jar --spring.profiles.active=prod
#
# 2026-08-30 PG→MySQL 迁移：生产数据源从 Supabase PG 切换为阿里云 RDS MySQL。
#
# 2026-08-31 配置策略调整（敏感值一律 gitignored yml，不用环境变量）：
# - 服务器在 ${APP_DIR}/config/application-prod.yaml（jar 同目录 config/，gitignored）
#   填写真实敏感值（DB/微信/JWT/Supabase），模板见 deploy/config-prod.example.yaml；
# - Spring Boot 外部化配置目录 ./config/ 优先级高于 classpath 同名文件 → 覆盖本文件
#   下方 ${...:} 空占位；systemd unit 已移除 EnvironmentFile 敏感注入（deploy.sh）。
# - 本地敏感值维护在 classpath 的 application-dev.yaml / application-mysql.yaml
#   （gitignored）——本地与生产各持一份 gitignored yml，互不干扰。
# - 下方占位仅作「配置缺失时启动即报错」的哨兵；空默认不产生可用值。

spring:
  datasource:
    # RDS MySQL 内网连接（同 VPC），必须附加 serverTimezone=Asia/Shanghai &
    # characterEncoding=utf8&useSSL=false&connectTimeout=5000&socketTimeout=8000。
    # 示例：jdbc:mysql://rm-xxxx.mysql.rds.aliyuncs.com:3306/qwt_mysql?...
    # 占位无空默认：外部 config/application-prod.yaml 未覆盖时启动即失败（哨兵，见 docs/agents/14）
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Schema 演进策略（2026-08-07 起）：与基础配置一致，Flyway 迁移 + validate 校验。
      # MySQL 环境迁移脚本 = db/migration-mysql（全量基线，见 docs/pg-to-mysql-migration-analysis.md）。
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    # MySQL 环境独立迁移目录：全新 RDS 库直接执行 V1 全量基线即达最新结构，
    # 数据由线上 PG 或本地验证库迁移（scripts/pg2mysql_*.py，见 docs/mysql-production-migration.md）。
    locations: classpath:db/migration-mysql
    baseline-on-migrate: false

# 微信小程序（secret 由外部 config/application-prod.yaml 覆盖，基础配置已声明 ${WECHAT_SECRET}，此处无需重复）

# Supabase Storage（前端直传，后端签发凭证——与 DB 解耦，迁移 MySQL 后继续使用）
supabase:
  storage:
    project-url: ${SUPABASE_PROJECT_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:qwt-public}

# 日志级别（生产环境收敛）
logging:
  level:
    root: INFO
    org.quwuting: INFO
    org.hibernate.SQL: WARN
