# 生产环境配置（阿里云 + Cloudflare Tunnel）
# 所有敏感值通过环境变量注入，禁止硬编码
# 启动命令：java -jar quwuting-service.jar --spring.profiles.active=prod

spring:
  datasource:
    # Supabase 事务池化（6543），必须附加 prepareThreshold=0（见 AGENTS.md 连接池兼容性章节）
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 低流量小程序 + 高延迟 DB（~150ms/往返），5 连接足够且节省内存
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000        # 空闲连接 5min 回收（默认 10min）
      max-lifetime: 900000        # 连接最长存活 15min（默认 30min，缩短减少泄漏窗口）
      connection-timeout: 10000   # 获取连接超时 10s（默认 30s，快速失败）
      leak-detection-threshold: 30000  # 连接持有超 30s 告警（排查未关闭连接）
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 微信小程序（secret 由环境变量注入，基础配置已声明 ${WECHAT_SECRET}，此处无需重复）

# Supabase Storage（前端直传，后端签发凭证）
supabase:
  storage:
    project-url: ${SUPABASE_PROJECT_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:qwt-public}

# 日志级别（生产环境收敛）
logging:
  level:
    root: INFO
    org.quwuting: INFO
    org.hibernate.SQL: WARN
