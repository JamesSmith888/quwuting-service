# 生产环境配置（阿里云 RDS MySQL + Cloudflare Tunnel）
# 所有敏感值通过环境变量注入，禁止硬编码
# 启动命令：java -jar quwuting-service.jar --spring.profiles.active=prod
#
# 2026-08-30 PG→MySQL 迁移：生产数据源从 Supabase PG 切换为阿里云 RDS MySQL。
# systemd 需注入 DB_URL（RDS 内网地址）/DB_USERNAME/DB_PASSWORD + SPRING_PROFILES_ACTIVE=prod。

spring:
  datasource:
    # RDS MySQL 内网连接（同 VPC），必须附加 serverTimezone=Asia/Shanghai &
    # characterEncoding=utf8&useSSL=false&connectTimeout=5000&socketTimeout=8000。
    # 示例：jdbc:mysql://rm-xxxx.mysql.rds.aliyuncs.com:3306/qwt_mysql?...
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Schema 演进策略（2026-08-07 起）：与基础配置一致，Flyway 迁移 + validate 校验。
      # MySQL 环境迁移脚本 = db/migration-mysql（全量基线，见 docs/pg-to-mysql-migration-analysis.md）。
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    # MySQL 环境独立迁移目录：全新 RDS 库直接执行 V1 全量基线即达最新结构，
    # 数据由线上 PG 或本地验证库迁移（scripts/pg2mysql_*.py，见 docs/mysql-production-migration.md）。
    locations: classpath:db/migration-mysql
    baseline-on-migrate: false

# 微信小程序（secret 由环境变量注入，基础配置已声明 ${WECHAT_SECRET}，此处无需重复）

# Supabase Storage（前端直传，后端签发凭证——与 DB 解耦，迁移 MySQL 后继续使用）
supabase:
  storage:
    project-url: ${SUPABASE_PROJECT_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:qwt-public}

# 日志级别（生产环境收敛）
logging:
  level:
    root: INFO
    org.quwuting: INFO
    org.hibernate.SQL: WARN
