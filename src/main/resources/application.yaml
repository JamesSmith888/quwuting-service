spring:
  application:
    name: quwuting-service
  jpa:
    hibernate:
      # Schema 演进策略（2026-08-07 起：Flyway 显式迁移 + validate 校验）：
      # ddl-auto 从 update 改为 validate——schema 变更一律由 db/migration/V{n} 脚本
      # 版本化执行，Hibernate 启动时只校验实体映射与实际表结构一致（不一致即
      # 拒绝启动，fail-fast）。背景根因见 AGENTS.md「Schema 演进与数据库完整性」。
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # DDL 执行失败即拒绝启动（Hibernate 默认仅 WARN 且应用照常启动，
        # 会留下"半迁移 schema + 运行期才炸"的隐患——2026-08-05 status 列
        # 事故中应用带残缺 schema 正常启动）。见 AGENTS.md「Schema 演进」。
        hbm2ddl:
          halt_on_error: true
  # Flyway 显式版本化迁移（2026-08-07 引入，替代 ddl-auto:update 自动演进）：
  # - 迁移脚本位于 classpath:db/migration（V{n}__描述.sql），与应用启动同步执行
  # - table 必须为 quwuting 专属历史表（qwt_flyway_schema_history）——本数据库与
  #   其他应用共用（同一 Supabase 项目 postgres 库），共用默认表 flyway_schema_history
  #   会让 Flyway 读到其他应用的历史（版本远高于本应用），把本应用全部迁移静默跳过
  #   （2026-08-08 事故：V4 qwt_messages 建表迁移被跳过 → Hibernate validate 启动失败，
  #   根因见 AGENTS.md「Schema 演进与数据库完整性 → 多应用共库」）
  # - baseline-on-migrate + baseline-version=1：已有库（schema 非空）首次启动将
  #   V1 标记为基线跳过执行（当前结构即基线），从 V2 起应用增量迁移；全新环境
  #   （空库）从 V1 顺序执行完整建表——两路径零冲突
  # - 迁移失败即启动失败（Flyway 默认行为），与 halt_on_error 同语义
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: qwt_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: 8080

# 微信小程序配置（appid 为公开信息，secret 必须通过环境变量注入）
wechat:
  appid: wx054a26bf9b1424dc
  secret: ${WECHAT_SECRET}

# JWT 签名配置（secret 必须通过环境变量注入，生产环境禁止使用默认值）
jwt:
  secret: ${JWT_SECRET}
  expiry-days: 7

# 门店系统默认标签（所有门店共享，展示时与自定义标签合并）
venue:
  default:
    tags:
      - 交谊舞
      - 舞厅
  # 「热门场所」标记（2026-08-08 确立，唯一事实源 = VenueHotProperties）：
  # 热门 = 城市内热度排名前 20% 且 行为热度（完整热度分扣除运营权重 sortWeight）
  # ≥ 本门槛。相对排名解决跨城市基数差异，绝对门槛排除"小池塘里最不冷"的伪热门。
  # 门槛作用于行为热度部分（2026-08-08 用户反馈根因修复）：sortWeight 仍参与排名与
  # 列表排序（运营推广提升曝光），但不得伪造热门资格——运营加权门店若行为热度不足
  # 门槛（如近30天仅 2 次浏览）不得标记热门，保证与详情页热度指数口径一致。
  # 默认 70 ≈ 近30天 7 次收藏 / 70 次浏览 / 14 条动态 的最低活跃信号。
  hot:
    min-heat-score: 70

# 用户上报配置
app:
  reports:
    # 平台对用户上报的处理承诺天数（前端提示"我们会在 X 日内维护好"中的 X 由此下发）
    maintenance-days: 3

# Supabase Storage 配置（前端直传模式，后端仅签发上传凭证）
supabase:
  storage:
    project-url: ${SUPABASE_PROJECT_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:qwt-public}
    max-file-size: 5242880  # 5MB
    allowed-extensions: .jpg,.jpeg,.png,.webp
