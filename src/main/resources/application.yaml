spring:
  application:
    name: quwuting-service
  jpa:
    hibernate:
      # Schema 演进策略（2026-08-05 确立）：默认自动更新——新表/新列由
      # ddl-auto:update 在启动时自动创建/追加，不手动执行 SQL 迁移。
      # 约束：新增 NOT NULL 列必须用 @ColumnDefault 声明默认值（禁止在
      # columnDefinition 中重复声明 DEFAULT，见 AGENTS.md「Schema 演进」）；
      # 实体移除字段必须保留映射兜底或走"无法避免"清单的手动 SQL。
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # DDL 执行失败即拒绝启动（Hibernate 默认仅 WARN 且应用照常启动，
        # 会留下"半迁移 schema + 运行期才炸"的隐患——2026-08-05 status 列
        # 事故中应用带残缺 schema 正常启动）。见 AGENTS.md「Schema 演进」。
        hbm2ddl:
          halt_on_error: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: 8080

# 微信小程序配置（appid 为公开信息，secret 必须通过环境变量注入）
wechat:
  appid: wx054a26bf9b1424dc
  secret: ${WECHAT_SECRET}

# JWT 签名配置（secret 必须通过环境变量注入，生产环境禁止使用默认值）
jwt:
  secret: ${JWT_SECRET}
  expiry-days: 7

# 门店系统默认标签（所有门店共享，展示时与自定义标签合并）
venue:
  default:
    tags:
      - 交谊舞
      - 舞厅

# 用户上报配置
app:
  reports:
    # 平台对用户上报的处理承诺天数（前端提示"我们会在 X 日内维护好"中的 X 由此下发）
    maintenance-days: 3

# Supabase Storage 配置（前端直传模式，后端仅签发上传凭证）
supabase:
  storage:
    project-url: ${SUPABASE_PROJECT_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:qwt-public}
    max-file-size: 5242880  # 5MB
    allowed-extensions: .jpg,.jpeg,.png,.webp
