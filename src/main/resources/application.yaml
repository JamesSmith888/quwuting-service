spring:
  application:
    name: quwuting-service
  # HikariCP 连接池统一调优（2026-08-10 事故根因修复，见 AGENTS.md「连接池与数据库抖动韧性」）：
  # 生产 systemd 以 dev profile 运行，application-dev.yaml 是唯一生效的数据源配置，原 prod.yaml
  # 的调优从未生效——连接池一直走 Spring Boot 默认值（keepalive 关闭、max-lifetime 30min、
  # connection-timeout 30s），死连接无法提前剔除，故障请求挂死（实测 19s）。
  # 场景：低流量小程序 + 跨洲高延迟 DB（ECS↔Supabase 事务池化 6543，单次往返 300~500ms）。
  # 本块置于基础配置，dev/prod 全环境生效，禁止在各环境 yaml 重复声明（防漂移）。
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000             # 空闲 5min 回收
      max-lifetime: 900000             # 连接最长 15min，低于 Supabase 池化器侧任何空闲回收窗口
      connection-timeout: 10000        # 获取连接 10s 快速失败（与前端请求超时同值）
      leak-detection-threshold: 30000  # 连接持有超 30s 告警（排查未关闭连接）
      validation-timeout: 3000         # 探活/校验 3s 上限（正常往返 500ms，余量充足）
      keepalive-time: 60000            # 每 60s 对空闲连接执行 isValid 探活：提前剔除死连接、
                                       # 保持 socket 活跃，避免被池化器/NAT 空闲回收后"借出即挂"
  jpa:
    hibernate:
      # Schema 演进策略（2026-08-07 起：Flyway 显式迁移 + validate 校验）：
      # ddl-auto 从 update 改为 validate——schema 变更一律由 db/migration/V{n} 脚本
      # 版本化执行，Hibernate 启动时只校验实体映射与实际表结构一致（不一致即
      # 拒绝启动，fail-fast）。背景根因见 AGENTS.md「Schema 演进与数据库完整性」。
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # DDL 执行失败即拒绝启动（Hibernate 默认仅 WARN 且应用照常启动，
        # 会留下"半迁移 schema + 运行期才炸"的隐患——2026-08-05 status 列
        # 事故中应用带残缺 schema 正常启动）。见 AGENTS.md「Schema 演进」。
        hbm2ddl:
          halt_on_error: true
  # Flyway 显式版本化迁移（2026-08-07 引入，替代 ddl-auto:update 自动演进）：
  # - 迁移脚本位于 classpath:db/migration（V{n}__描述.sql），与应用启动同步执行
  # - table 必须为 quwuting 专属历史表（qwt_flyway_schema_history）——本数据库与
  #   其他应用共用（同一 Supabase 项目 postgres 库），共用默认表 flyway_schema_history
  #   会让 Flyway 读到其他应用的历史（版本远高于本应用），把本应用全部迁移静默跳过
  #   （2026-08-08 事故：V4 qwt_messages 建表迁移被跳过 → Hibernate validate 启动失败，
  #   根因见 AGENTS.md「Schema 演进与数据库完整性 → 多应用共库」）
  # - baseline-on-migrate + baseline-version=1：已有库（schema 非空）首次启动将
  #   V1 标记为基线跳过执行（当前结构即基线），从 V2 起应用增量迁移；全新环境
  #   （空库）从 V1 顺序执行完整建表——两路径零冲突
  # - 迁移失败即启动失败（Flyway 默认行为），与 halt_on_error 同语义
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: qwt_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: 8080

# 微信小程序配置（appid 为公开信息，secret 必须通过环境变量注入）
wechat:
  appid: wx054a26bf9b1424dc
  secret: ${WECHAT_SECRET}

# JWT 签名配置（secret 必须通过环境变量注入，生产环境禁止使用默认值）
jwt:
  secret: ${JWT_SECRET}
  expiry-days: 7

# 门店系统默认标签（所有门店共享，展示时与自定义标签合并）
venue:
  default:
    tags:
      - 交谊舞
      - 舞厅
  # 「热门场所」标记（2026-08-08 确立，唯一事实源 = VenueHotProperties）：
  # 热门 = 城市内热度排名前 20% 且 行为热度（完整热度分扣除运营权重 sortWeight）
  # ≥ 本门槛。相对排名解决跨城市基数差异，绝对门槛排除"小池塘里最不冷"的伪热门。
  # 门槛作用于行为热度部分（2026-08-08 用户反馈根因修复）：sortWeight 仍参与排名与
  # 列表排序（运营推广提升曝光），但不得伪造热门资格——运营加权门店若行为热度不足
  # 门槛（如近30天仅 2 次浏览）不得标记热门，保证与详情页热度指数口径一致。
  # 默认 70 ≈ 近30天 7 次收藏 / 70 次浏览 / 14 条动态 的最低活跃信号。
  hot:
    min-heat-score: 70

# 用户上报配置
app:
  reports:
    # 平台对用户上报的处理承诺天数（前端提示"我们会在 X 日内维护好"中的 X 由此下发）
    maintenance-days: 3
  # 批量地理编码配置（2026-08-11 新增，管理端「一键补齐坐标」）：
  # 腾讯位置服务 WebService key，只放后端不落前端；生产经 QQMAP_KEY 环境变量注入
  geocode:
    key: ${QQMAP_KEY:}
  # 积分系统配置（2026-08-10 V2：全部参数配置化，禁止业务硬编码）
  points:
    # 每日打卡奖励（积分）
    check-in-reward: 2
    # 上报被管理员采纳后的奖励（积分；V2 决策：不设每日条数上限，防刷由管理员采纳把关）
    feedback-reward: 5
    # 暂停营业报告被管理员采纳后的奖励（积分；与 feedback-reward 同属众包信号采纳池，
    # 独立键便于运营分别调节，2026-08-10）
    status-report-reward: 5
    # 积分对热度公式的权重（V2 三阶段校准机制的校准对象——初始保守值 2，
    # 上线 2 周后按"积分贡献占比 ∈ [5%,15%]"目标区间校准，改本值重启即生效，
    # 公式文案后端下发自动同步，见 AGENTS.md「积分系统 · 排名权重校准」）
    heat-weight: 2
    gift:
      # 单次赠送上限（礼物价格折算积分价值；2026-08-12 礼物化——单个礼物最贵 5 分，防御性保留）
      max-per-gift: 10
      # 每日赠送总额上限（积分价值）
      max-per-day: 20
      # 单目标每日赠送上限（积分价值）
      max-per-target-day: 5
    # 积分解锁门槛（2026-08-14 公共模块：照片/联系方式等"内容点"自由设置是否需要积分）
    gate:
      # 单点门槛积分上限（cost>0 设置门槛、≤ 本值；cost=0 清除门槛 = 免费）
      max-cost: 50
  # 舞伴创作者收益计划（2026-08-14）：激励视频广告位 ID——运营可调参数（更换广告位
  # 无需发版），由后端下发到舞伴详情响应（earningsAdUnitId），前端零硬编码。
  # 需小程序开通流量主后填真实广告位；留空 = 未配置，详情页不渲染广告入口。
  dancer-ad:
    ad-unit-id: ${DANCER_AD_UNIT_ID:}

# Supabase Storage 配置（前端直传模式，后端仅签发上传凭证）
supabase:
  storage:
    project-url: ${SUPABASE_PROJECT_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:qwt-public}
    max-file-size: 5242880  # 5MB
    allowed-extensions: .jpg,.jpeg,.png,.webp
